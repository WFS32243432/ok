<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f2">
  <title>Været i Halden</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #23332d;
      background: #f3f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #74817b;
      --green: #2f6b50;
      --line: #e8ede7;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 82% 4%, rgba(216, 231, 205, .6), transparent 34rem),
        #f3f6f2;
    }

    button { font: inherit; }

    .page { width: min(100%, 920px); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.25rem); letter-spacing: -.045em; }

    .refresh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #dfe7df;
      border-radius: 999px;
      color: #40564a;
      background: rgba(255, 255, 255, .76);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .refresh:hover { background: white; transform: translateY(-1px); }
    .refresh:disabled { cursor: wait; opacity: .65; }

    .card {
      overflow: hidden;
      border: 1px solid rgba(226, 233, 225, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 16px 48px rgba(41, 63, 48, .07);
    }

    .current {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 32px;
      align-items: center;
      min-height: 270px;
      padding: 36px 42px;
      background: linear-gradient(115deg, rgba(255,255,255,.98), rgba(242,248,237,.82));
    }

    .date { margin: 0 0 18px; color: var(--muted); font-size: .95rem; }
    .temperature { margin: 0; font-size: clamp(4.5rem, 13vw, 7rem); font-weight: 650; letter-spacing: -.09em; line-height: .95; }
    .temperature small { font-size: .47em; font-weight: 450; vertical-align: top; }
    .condition { margin: 14px 0 0; color: #53645a; font-size: 1.08rem; }
    .weather-icon { justify-self: center; font-size: clamp(6rem, 16vw, 9.5rem); filter: drop-shadow(0 10px 14px rgba(72, 91, 61, .12)); }

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
    }

    .detail { padding: 20px 24px; }
    .detail + .detail { border-left: 1px solid var(--line); }
    .detail-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .78rem; }
    .detail-value { font-size: 1rem; font-weight: 700; }

    .section { margin-top: 30px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 1.15rem; letter-spacing: -.025em; }
    .section-note { margin: 0; color: var(--muted); font-size: .8rem; }

    .hourly {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      padding: 20px 10px;
    }

    .hour {
      display: grid;
      justify-items: center;
      gap: 11px;
      padding: 4px 8px;
      color: #66746b;
      font-size: .84rem;
    }

    .hour + .hour { border-left: 1px solid var(--line); }
    .hour-icon { font-size: 1.55rem; }
    .hour-temp { color: #293a30; font-size: 1rem; font-weight: 700; }
    .hour-rain { color: #6787a0; font-size: .74rem; }

    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .day { display: grid; justify-items: center; gap: 12px; padding: 20px 8px; text-align: center; }
    .day + .day { border-left: 1px solid var(--line); }
    .day-name { font-size: .82rem; font-weight: 650; }
    .day-icon { font-size: 1.55rem; }
    .day-temps { display: flex; gap: 9px; font-size: .82rem; font-weight: 700; }
    .day-low { color: #9aa49e; font-weight: 500; }

    .status { padding: 18px; color: var(--muted); text-align: center; }
    .status.error { color: #9a3e36; }
    footer { padding: 22px 4px 0; color: #87918a; font-size: .77rem; text-align: center; }
    footer a { color: #61796a; }

    @media (max-width: 640px) {
      body { padding: 28px 14px; }
      header { margin-bottom: 18px; }
      .current { min-height: 220px; gap: 8px; padding: 28px 24px; }
      .details { grid-template-columns: repeat(2, 1fr); }
      .detail { padding: 16px 18px; }
      .detail:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
      .detail:nth-child(4) { border-top: 1px solid var(--line); }
      .hourly { padding: 16px 4px; }
      .hour { gap: 9px; padding: 4px; font-size: .75rem; }
      .forecast .day { padding: 17px 3px; gap: 10px; }
      .day-name, .day-temps { font-size: .72rem; }
    }

    @media (max-width: 390px) {
      .current { padding: 24px 18px; }
      .hour-icon, .day-icon { font-size: 1.3rem; }
      .hour-rain { font-size: .68rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Lokalt vær</p>
        <h1>Været i Halden</h1>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Oppdater været">
        <span aria-hidden="true">↻</span> Oppdater
      </button>
    </header>

    <section class="card" aria-label="Været akkurat nå">
      <div class="current" id="current">
        <div>
          <p class="date" id="date">Henter værdata …</p>
          <p class="temperature" id="temperature">—<small>°</small></p>
          <p class="condition" id="condition">Værdata lastes inn</p>
        </div>
        <div class="weather-icon" id="weather-icon" aria-hidden="true">🌤️</div>
      </div>
      <div class="details" id="details" aria-live="polite">
        <div class="detail"><span class="detail-label">Føles som</span><span class="detail-value" id="feels-like">—</span></div>
        <div class="detail"><span class="detail-label">Luftfuktighet</span><span class="detail-value" id="humidity">—</span></div>
        <div class="detail"><span class="detail-label">Vind</span><span class="detail-value" id="wind">—</span></div>
        <div class="detail"><span class="detail-label">Nedbør</span><span class="detail-value" id="precipitation">—</span></div>
      </div>
    </section>

    <section class="section" aria-labelledby="hourly-title">
      <div class="section-heading">
        <h2 id="hourly-title">De neste timene</h2>
        <p class="section-note">Temperatur og regnsjanse</p>
      </div>
      <div class="card hourly" id="hourly" aria-live="polite">
        <div class="status">Henter timevarsel …</div>
      </div>
    </section>

    <section class="section" aria-labelledby="forecast-title">
      <div class="section-heading">
        <h2 id="forecast-title">Femdagersvarsel</h2>
        <p class="section-note">Maks- og minimumstemperatur</p>
      </div>
      <div class="card forecast" id="forecast" aria-live="polite">
        <div class="status">Henter værvarsel …</div>
      </div>
    </section>

    <footer>
      Værdata fra <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>
      · Halden, Norge
      <span id="updated"></span>
    </footer>
  </main>

  <script>
    const weatherDescriptions = {
      0: ["Klart", "☀️"],
      1: ["For det meste klart", "🌤️"],
      2: ["Delvis skyet", "⛅"],
      3: ["Overskyet", "☁️"],
      45: ["Tåke", "🌫️"],
      48: ["Rimtåke", "🌫️"],
      51: ["Lett yr", "🌦️"],
      53: ["Yr", "🌦️"],
      55: ["Kraftig yr", "🌧️"],
      56: ["Underkjølt yr", "🌧️"],
      57: ["Kraftig underkjølt yr", "🌧️"],
      61: ["Lett regn", "🌦️"],
      63: ["Regn", "🌧️"],
      65: ["Kraftig regn", "🌧️"],
      66: ["Underkjølt regn", "🌧️"],
      67: ["Kraftig underkjølt regn", "🌧️"],
      71: ["Lett snø", "🌨️"],
      73: ["Snø", "🌨️"],
      75: ["Kraftig snø", "❄️"],
      77: ["Snøkorn", "🌨️"],
      80: ["Lette regnbyger", "🌦️"],
      81: ["Regnbyger", "🌧️"],
      82: ["Kraftige regnbyger", "🌧️"],
      85: ["Lette snøbyger", "🌨️"],
      86: ["Kraftige snøbyger", "❄️"],
      95: ["Tordenvær", "⛈️"],
      96: ["Tordenvær med hagl", "⛈️"],
      99: ["Kraftig tordenvær med hagl", "⛈️"]
    };

    const descriptionFor = (code) => weatherDescriptions[code] || ["Ukjent vær", "🌡️"];
    const number = (value) => Math.round(value);
    const dateFormatter = new Intl.DateTimeFormat("no-NO", {
      weekday: "long", day: "numeric", month: "long"
    });

    function renderHourly(hourly, currentTime) {
      const currentHour = currentTime.slice(0, 13);
      let start = hourly.time.findIndex((time) => time.slice(0, 13) >= currentHour);
      if (start < 0) start = 0;
      const hours = hourly.time.slice(start, start + 6);

      document.querySelector("#hourly").innerHTML = hours.map((time, offset) => {
        const index = start + offset;
        const label = offset === 0 ? "Nå" : new Intl.DateTimeFormat("no-NO", {
          hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo"
        }).format(new Date(time));
        const [description, icon] = descriptionFor(hourly.weather_code[index]);
        return `<div class="hour" title="${description}">
          <span>${label}</span>
          <span class="hour-icon" aria-hidden="true">${icon}</span>
          <span class="hour-temp">${number(hourly.temperature_2m[index])}°</span>
          <span class="hour-rain">${hourly.precipitation_probability[index] ?? 0}% regn</span>
        </div>`;
      }).join("");
    }

    function renderForecast(daily) {
      document.querySelector("#forecast").innerHTML = daily.time.map((date, index) => {
        const [description, icon] = descriptionFor(daily.weather_code[index]);
        const day = index === 0 ? "I dag" : new Intl.DateTimeFormat("no-NO", {
          weekday: "short", timeZone: "Europe/Oslo"
        }).format(new Date(`${date}T12:00:00`));
        return `<div class="day" title="${description}">
          <span class="day-name">${day}</span>
          <span class="day-icon" aria-hidden="true">${icon}</span>
          <span class="day-temps">
            <span>${number(daily.temperature_2m_max[index])}°</span>
            <span class="day-low">${number(daily.temperature_2m_min[index])}°</span>
          </span>
        </div>`;
      }).join("");
    }

    async function loadWeather() {
      const button = document.querySelector("#refresh");
      button.disabled = true;
      document.querySelector("#date").textContent = "Henter oppdatert vær …";
      document.querySelector("#condition").textContent = "Værdata lastes inn";
      try {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude: "59.1205",
          longitude: "11.3875",
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m",
          hourly: "temperature_2m,precipitation_probability,weather_code",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          timezone: "Europe/Oslo",
          forecast_days: "5"
        });
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Værtjenesten svarte med status ${response.status}`);
        const data = await response.json();

        const [description, icon] = descriptionFor(data.current.weather_code);
        document.querySelector("#date").textContent = dateFormatter.format(new Date());
        document.querySelector("#temperature").innerHTML = `${number(data.current.temperature_2m)}<small>°</small>`;
        document.querySelector("#condition").textContent = description;
        document.querySelector("#weather-icon").textContent = icon;
        document.querySelector("#feels-like").textContent = `${number(data.current.apparent_temperature)} °C`;
        document.querySelector("#humidity").textContent = `${data.current.relative_humidity_2m} %`;
        document.querySelector("#wind").textContent = `${number(data.current.wind_speed_10m)} km/t`;
        document.querySelector("#precipitation").textContent = `${data.current.precipitation} mm`;
        renderHourly(data.hourly, data.current.time);
        renderForecast(data.daily);
        document.querySelector("#updated").textContent = ` · Oppdatert kl. ${new Intl.DateTimeFormat("no-NO", {
          hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo"
        }).format(new Date())}`;
      } catch (error) {
        console.error("Kunne ikke hente værdata:", error);
        document.querySelector("#date").textContent = "Værdata er ikke tilgjengelig";
        document.querySelector("#condition").textContent = "Kontroller internettforbindelsen og prøv igjen.";
        document.querySelector("#hourly").innerHTML = '<p class="status error">Kunne ikke hente timevarsel.</p>';
        document.querySelector("#forecast").innerHTML = '<p class="status error">Kunne ikke hente værvarsel.</p>';
      } finally {
        button.disabled = false;
      }
    }

    document.querySelector("#refresh").addEventListener("click", loadWeather);
    loadWeather();
  </script>
</body>
</html>
